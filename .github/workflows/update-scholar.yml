name: Update Google Scholar data

on:
  schedule:
    - cron: "17 9 * * 1"   # Mondays 09:17 UTC
    - cron: "17 9 * * 4"   # Thursdays, extra attempt in case Scholar blocked Monday's run
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-scholar
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh publications and citation metrics
        run: python3 scripts/update_scholar.py
      - name: Commit changes
        run: |
          if git diff --quiet -- index.html data/scholar.json; then
            echo "Nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html data/scholar.json
          git commit -m "chore: update Google Scholar data"
          git push
